<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="disc" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#1C1A24"/>
      <stop offset="55%" stop-color="#131019"/>
      <stop offset="100%" stop-color="#09080D"/>
    </radialGradient>
    <linearGradient id="gold" x1="18" y1="14" x2="46" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4DFAE"/>
      <stop offset="0.5" stop-color="#D8AE64"/>
      <stop offset="1" stop-color="#9C7635"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9CD8E"/>
      <stop offset="0.5" stop-color="#8C6C3A"/>
      <stop offset="1" stop-color="#E9CD8E"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
  </defs>

  <circle cx="32" cy="32" r="31" fill="url(#disc)"/>
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="url(#ring)" stroke-width="0.6" opacity="0.75"/>

  <!-- soft ambient glow behind mark -->
  <polygon points="32,18 44,32 32,46 20,32" fill="#D8AE64" opacity="0.16" filter="url(#soft)"/>

  <!-- fine hairline facet mark -->
  <g fill="none" stroke="url(#gold)" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="32,17 45,32 32,47 19,32"/>
    <path d="M32,17 L32,47 M19,32 L45,32"/>
    <path d="M32,17 L26,26 M32,17 L38,26 M32,47 L26,38 M32,47 L38,38"/>
  </g>

  <!-- center vertex -->
  <circle cx="32" cy="32" r="1.3" fill="#F4DFAE"/>

  <!-- top specular sliver -->
  <path d="M32,17 L37,24.5" stroke="#FBEDCE" stroke-width="0.9" stroke-linecap="round" opacity="0.9"/>
</svg>
